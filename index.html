<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Christian</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      min-height:100%;
      background:#0f0f10;
      overscroll-behavior:none;
    }

    body{
      min-height:100dvh;
      overflow-y:auto;
      overflow-x:hidden;

      font-family:Arial,sans-serif;

      background:
        radial-gradient(circle at top left, rgba(255,215,0,0.10), transparent 25%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 25%),
        linear-gradient(145deg,#0f0f10,#161616,#1d1d1d);

      display:flex;
      justify-content:center;
      align-items:flex-start;

      padding:50px 0;

      position:relative;

      color:white;

      -webkit-overflow-scrolling:touch;
    }

    .luxury-lines{
      position:fixed;
      inset:0;
      overflow:hidden;
      z-index:0;
      pointer-events:none;
    }

    .gold-line{
      position:absolute;

      width:700px;
      height:1px;

      background:linear-gradient(
        90deg,
        transparent,
        rgba(255,215,0,0.25),
        transparent
      );

      transform:rotate(-25deg);

      animation:lineMove 12s linear infinite;
    }

    .gold1{
      top:15%;
      left:-400px;
    }

    .gold2{
      top:50%;
      left:-500px;
      animation-delay:4s;
    }

    .gold3{
      bottom:10%;
      left:-450px;
      animation-delay:8s;
    }

    @keyframes lineMove{
      from{
        transform:rotate(-25deg) translateX(0);
      }

      to{
        transform:rotate(-25deg) translateX(650px);
      }
    }

    .glow{
      position:fixed;
      border-radius:50%;
      filter:blur(100px);
      opacity:0.15;
      z-index:0;
      pointer-events:none;

      animation:glowFloat 10s ease-in-out infinite alternate;
    }

    .glow1{
      width:300px;
      height:300px;
      background:#ffd700;

      top:-120px;
      left:-100px;
    }

    .glow2{
      width:320px;
      height:320px;
      background:#ffffff;

      bottom:-150px;
      right:-100px;

      animation-delay:4s;
    }

    @keyframes glowFloat{
      from{
        transform:translateY(0px);
      }

      to{
        transform:translateY(30px);
      }
    }

    .particle{
      position:fixed;
      width:4px;
      height:4px;
      border-radius:50%;

      background:rgba(255,215,0,0.5);

      z-index:0;

      animation:particleFloat 5s ease-in-out infinite alternate;
    }

    .p1{
      top:18%;
      left:15%;
    }

    .p2{
      top:30%;
      right:18%;
      animation-delay:2s;
    }

    .p3{
      bottom:22%;
      left:22%;
      animation-delay:4s;
    }

    .p4{
      bottom:18%;
      right:20%;
      animation-delay:1s;
    }

    @keyframes particleFloat{
      from{
        transform:translateY(0px) scale(1);
        opacity:0.3;
      }

      to{
        transform:translateY(15px) scale(1.8);
        opacity:1;
      }
    }

    .card{
      position:relative;
      z-index:2;

      width:92%;
      max-width:430px;

      padding:40px 30px;

      border-radius:32px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.06),
          rgba(255,255,255,0.02)
        );

      border:1px solid rgba(255,215,0,0.12);

      backdrop-filter:blur(18px);

      box-shadow:
        0 10px 50px rgba(0,0,0,0.5),
        0 0 40px rgba(255,215,0,0.06);

      overflow:hidden;
    }

    .card::before{
      content:"";

      position:absolute;

      top:0;
      left:-40%;

      width:180%;
      height:4px;

      background:linear-gradient(
        90deg,
        transparent,
        #ffd700,
        #ffffff,
        #ffd700,
        transparent
      );

      animation:topMove 6s linear infinite;
    }

    @keyframes topMove{
      from{
        transform:translateX(-20%);
      }

      to{
        transform:translateX(20%);
      }
    }

    .profile-wrapper{
      position:relative;
      width:fit-content;
      margin:auto;
      margin-bottom:28px;
    }

    .profile-ring{
      position:absolute;
      inset:-9px;

      border-radius:50%;

      background:
        conic-gradient(
          #ffd700,
          #ffffff,
          #ffd700
        );

      animation:spin 10s linear infinite;

      opacity:0.8;

      z-index:-1;

      filter:blur(2px);
    }

    @keyframes spin{
      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }
    }

    .profile-pic{
      width:150px;
      height:150px;

      border-radius:50%;
      object-fit:cover;

      border:5px solid #181818;

      display:block;
    }

    h1{
      text-align:center;

      font-size:38px;

      margin-bottom:10px;

      letter-spacing:1px;

      background:linear-gradient(
        90deg,
        #ffffff,
        #ffd700
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      text-align:center;

      color:#c8c8c8;

      line-height:1.6;

      margin-bottom:36px;

      font-size:15px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .button{
      position:relative;

      overflow:hidden;

      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:18px 20px;

      border-radius:22px;

      text-decoration:none;

      color:white;

      border:1px solid rgba(255,255,255,0.06);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.05),
          rgba(255,255,255,0.02)
        );

      transition:0.3s ease;

      backdrop-filter:blur(12px);
    }

    .button:hover{
      transform:translateY(-4px);

      border-color:rgba(255,215,0,0.25);

      box-shadow:
        0 0 20px rgba(255,215,0,0.08);
    }

    .button::before{
      content:"";

      position:absolute;
      inset:0;

      background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.08),
        transparent
      );

      transform:translateX(-100%);

      animation:shine 5s linear infinite;
    }

    @keyframes shine{
      from{
        transform:translateX(-100%);
      }

      to{
        transform:translateX(200%);
      }
    }

    .button-left{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .icon{
      width:55px;
      height:55px;

      border-radius:18px;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:23px;

      flex-shrink:0;

      background:
        linear-gradient(
          145deg,
          #2b2b2b,
          #171717
        );

      border:1px solid rgba(255,215,0,0.12);

      box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.04);
    }

    .text-group h2{
      font-size:17px;
      margin-bottom:3px;
    }

    .text-group p{
      font-size:13px;
      opacity:0.7;
    }

    .arrow{
      font-size:22px;
      opacity:0.45;
    }

  </style>
</head>

<body>

  <div class="luxury-lines">
    <div class="gold-line gold1"></div>
    <div class="gold-line gold2"></div>
    <div class="gold-line gold3"></div>
  </div>

  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>

  <div class="card">

    <div class="profile-wrapper">

      <a class="button"

          <div class="text-group">

      </a>

    </div>

  </div>

</body>
</html>
